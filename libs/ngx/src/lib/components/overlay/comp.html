@let isVisible = isVisibleSignal();

@if (isVisible) {
  <div
    class="root fixed inset-0 z-(--x-overlay-resolved-z-index) flex flex-col items-center justify-center bg-(--x-overlay-resolved-color)"
    animate.enter="enter"
    animate.leave="leave"
    (click)="onClicked()"
  >
    @if (isVisible) {
      <div (click)="$event.stopPropagation()">
        <ng-content />
      </div>
    }
  </div>
}
