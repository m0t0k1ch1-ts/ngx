@let toast = toastSignal();

@let iconSize = '20px';

<div
  class="flex flex-row gap-2 rounded-lg border bg-white/95 p-4 drop-shadow-xs"
  [class.border-green-100]="toast.type === 'SUCCESS'"
  [class.border-red-100]="toast.type === 'ERROR'"
>
  @switch (toast.type) {
    @case ('SUCCESS') {
      <div class="text-green-500">
        <ng-icon name="heroCheckCircleSolid" [size]="iconSize" />
      </div>
    }
    @case ('ERROR') {
      <div class="text-red-500">
        <ng-icon name="heroExclamationCircleSolid" [size]="iconSize" />
      </div>
    }
  }
  <div class="flex min-w-0 grow flex-col gap-2 text-sm">
    <span
      class="font-bold"
      [class.text-green-500]="toast.type === 'SUCCESS'"
      [class.text-red-500]="toast.type === 'ERROR'"
    >
      {{ toast.title }}
    </span>
    <span class="wrap-break-word">{{ toast.message }}</span>
  </div>
  <div class="text-gray-300">
    <ng-icon
      name="heroXMarkSolid"
      [size]="iconSize"
      class="cursor-pointer"
      (click)="onClickCloseButton()"
    />
  </div>
</div>
