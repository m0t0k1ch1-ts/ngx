@let toast = toastSignal();

@let iconName = iconNameSignal();

<div
  class="flex flex-row gap-2 rounded-lg border border-(--this-border-color) bg-white/95 p-4 drop-shadow-xs"
>
  <div class="text-(--this-icon-color)">
    <ng-icon [name]="iconName" size="20px" />
  </div>
  <div class="flex min-w-0 grow flex-col gap-2 text-sm">
    <span class="font-bold text-(--this-title-color)">{{ toast.title }}</span>
    <span class="wrap-break-word">{{ toast.message }}</span>
  </div>
  <div class="text-gray-300">
    <ng-icon
      name="heroXMarkSolid"
      size="20px"
      class="cursor-pointer"
      (click)="onCloseButtonClicked()"
    />
  </div>
</div>
